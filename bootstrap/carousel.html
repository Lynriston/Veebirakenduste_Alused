<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carousel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">
        <div
        id="carouselExampleSlide"
        class="carousel slide"
        data-bs-ride="carousel">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="https://mdbootstrap.com/img/Photos/Slides/img%20(35).jpg" 
                    alt=""
                    class="d-block w-100">
                </div>

                <div class="carousel-item">
                    <img src="https://mdbootstrap.com/img/Photos/Slides/img%20(36).jpg" 
                    alt=""
                    class="d-block w-100">
                </div>

                <div class="carousel-item active">
                    <img src="https://mdbootstrap.com/img/Photos/Slides/img%20(20).jpg" 
                    alt=""
                    class="d-block w-100">
                </div>
            </div>
        </div>
    </div>
</body>
</html>
